name: Run Python Tests

on:
  push:
    branches:
      - m
  pull_request:
    branches:
      - m

jobs:
  run-pytest:
    uses: George-Ogden/actions/.github/workflows/python-test.yaml@v5.2.2
    with:
      python-versions: "['3.15']"
      pytest-flags: -vv -m "not local"
      package-resolution: lowest-direct
