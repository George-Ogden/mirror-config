name: Tag New Version and Release

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tag-and-release:
    uses: George-Ogden/actions/.github/workflows/python-release.yaml@v4.6.2
    with:
      python-versions: "['3.14']"
      validation-code: "import module" # fixme: use correct module
