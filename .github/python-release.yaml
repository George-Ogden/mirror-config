name: Tag New Version and Release

on:
  push:
    branches:
      - m
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  tag-and-release:
    uses: George-Ogden/actions/.github/workflows/python-release.yaml@v4.7.1
    with:
      validation-code: "import module" # fixme: use correct module
      python-version: "3.14"
