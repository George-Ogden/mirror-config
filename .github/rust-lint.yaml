name: Lint Rust Code with Cargo and Prek

on:
  push:
    branches:
      - m
  pull_request:
    branches:
      - m

jobs:
  prek-lint:
    uses: George-Ogden/actions/.github/workflows/lint.yaml@v5.1.2

  cargo-lint:
    uses: George-Ogden/actions/.github/workflows/rust-lint.yaml@v5.1.2
    with:
      rust-version: stable
