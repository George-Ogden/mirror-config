rules:
  - id: dataclass-brackets
    languages:
      - python
    severity: ERROR
    message: Remove brackets from `@dataclass` usage.
    patterns:
      - pattern-inside: |
          @dataclass()
          class $X:
            ...
      - pattern-regex: '@dataclass\(\)'
    fix: "@dataclass"

  - id: more-itertools-flatten
    message: Replace calls to `itertools.chain.from_iterable` with
      `more_itertools.flatten`.
    languages:
      - python
    severity: ERROR
    pattern: |
      itertools.chain.from_iterable($X)
    fix: |
      mit.flatten($X)

  - id: empty-abstract-method
    languages:
      - python
    severity: ERROR
    message: Fill in the body or `raise NotImplementedError()` to prevent issues in derived classes.
    patterns:
      - pattern: |
          @abc.abstractmethod
          def $F(...) -> ...:
            $BODY
      - metavariable-regex:
          metavariable: $BODY
          regex: ^\.\.\.$
    fix-regex:
      regex: \.\.\.
      replacement: raise NotImplementedError()

  - id: empty-protocol-method
    languages:
      - python
    severity: ERROR
    message: Fill in the body or `raise NotImplementedError()` to prevent issues in implementations.
    patterns:
      - pattern: |-
          def $F(...) -> ...:
            $BODY
      - pattern-inside: |
          class $X(Protocol, ...):
            ...
      - metavariable-regex:
          metavariable: $BODY
          regex: ^\.\.\.$
    fix-regex:
      regex: \.\.\.
      replacement: raise NotImplementedError()
