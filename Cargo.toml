[package]
name = "" # fixme
version = "0.0.0"
edition = "2024"

[dependencies]
ambassador = "0.5.1"
derive_more = { version = "2.1.1", features = ["full"] }
itertools = "0.14.0"

[dev-dependencies]
pretty_assertions = "1.4.1"
test-case = "3.3.1"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3

[profile.bench]
inherits = "release"
debug = true

[workspace]
members = ["crates/*"]
resolver = "2"

[lints]
workspace = true

[workspace.lints.rust]
warnings = "deny"
dead_code = "allow"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
missing_panics_doc = "allow"
missing_errors_doc = "allow"
should_panic_without_expect = "allow"
len_without_is_empty = "allow"
from_iter_instead_of_collect = "allow"
